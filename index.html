<style>
[hidden]{display:none!important}
.drawer-trigger,.drawer-close,.drawer-shade{display:none}
#sidebar[hidden],.top.signed-out .drawer-trigger{display:none}
.menu-children{padding:0 0 4px 10px}.menu-children .nav{font-size:.95em;padding:9px}
.main-navigation{display:flex;flex-direction:column;gap:2px}

.main-navigation [aria-expanded=true]::after{transform:rotate(90deg)}
.bottom-sheet-title{margin:0 0 10px}
.pagination{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.survey-progress{width:100%;height:10px;accent-color:var(--green)}
.survey-step{min-width:0;margin:12px 0}
.survey-footer{position:sticky;bottom:0;background:white;z-index:12;padding:8px 0;margin-top:14px;border-top:1px solid var(--line)}
.survey-line summary{cursor:pointer;padding:8px 0}#surveyHealth.empty::after{content:"ไม่มีสมาชิกในแบบสำรวจ";color:var(--muted)}
.survey-recap{overflow-wrap:anywhere}
.field-map{height:clamp(280px,58dvh,680px);min-height:0}
.map-list{list-style:none;padding:0;margin:0}

.map-map-status{min-height:1.4em}
#builderForm input[type=checkbox]{width:auto}
.field-map .leaflet-control-zoom a{width:44px;height:44px;line-height:44px}
.offline-notice{margin:0;padding:8px 12px;background:#fff1cd;color:#684400;text-align:center}
.panel,.field,fieldset,.toolbar>*{min-width:0}
.panel,.nav{overflow-wrap:anywhere}
.field input,.field select,.field textarea{max-width:100%;min-width:0}
.tablewrap,.chartbox{max-width:100%}
@media(max-width:820px),(max-width:920px) and (max-height:500px){
 .top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;padding:8px 10px;min-height:0}
 .top .brand{min-width:0}.brand strong{font-size:clamp(15px,4vw,20px);line-height:1.25}
 .brand small{font-size:11px}.top .account{grid-column:2;margin:0;justify-content:flex-start;width:auto;gap:6px}
 .top .account span{font-size:13px;overflow-wrap:anywhere}.top .account .btn{padding:6px 10px}
 .top.signed-out{grid-template-columns:minmax(0,1fr) auto}
 .top.signed-out .account{grid-row:1;justify-content:flex-end}
 .drawer-trigger{display:grid;place-items:center;width:44px;height:44px;background:#fff2;border:1px solid #ffffff80;border-radius:8px;color:white;font-size:23px}
 .layout{display:block}.layout aside{display:none;position:fixed;inset:0 auto 0 0;width:min(86vw,340px);z-index:1203;overflow:auto;overscroll-behavior:contain;padding:12px}
 .layout aside.open{display:block}.drawer-shade.open{display:block;position:fixed;inset:0;z-index:1202;background:#10281e99;border:0}
 .drawer-close{display:block;margin:0 0 12px auto}
 main{padding:12px 10px calc(12px + env(safe-area-inset-bottom));width:100%}
 .btn,.nav,.combo-options button{min-height:44px}.gridform,.filtergrid{grid-template-columns:minmax(0,1fr)}
 input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px}
 .modal:not(.hidden){align-items:flex-end;padding:0}.modal>.panel{width:100%;max-width:none;max-height:100dvh;border-radius:16px 16px 0 0;padding:14px 12px calc(12px + env(safe-area-inset-bottom))}
 .field-map{height:clamp(245px,53dvh,520px)}
 #toast{bottom:calc(12px + env(safe-area-inset-bottom));right:12px;max-width:calc(100% - 24px)}
}
@media(max-height:500px) and (max-width:920px){.field-map{height:66dvh}.survey-footer{position:static}}

  const transportError=()=>settle(reject,Object.assign(Error('ติดต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจอินเทอร์เน็ตแล้วลองใหม่'),{network:true}));

   if(finished)return;

function auditTable(entries,includeDetails=false){

  const date=new Date(row.timestamp),valid=Number.isFinite(date.getTime());

  const action=({create:'เพิ่ม',update:'แก้ไข',delete:'ลบ',login:'เข้าสู่ระบบ',read:'เปิดดู',archive:'เก็บเข้าคลัง',export:'ส่งออก',import:'นำเข้า'})[row.action]||row.action;

 }));

 else{
  locationRequest=null;
  pickerMarker?.remove();pickerMarker=null;
  $('locationStatus').textContent='กรุณากรอกละติจูดและลองจิจูดให้ถูกต้องทั้งสองช่อง หรือเลือกบนแผนที่';
 }

function setLocation(lat,lng,accuracy,dirty=true){
 const form=pickerForm;
 if(!form||!validCoordinate(lat,lng))return;
 const home=linkedPlaceHome(form),linked=home&&validCoordinate(home.lat,home.lng);
 const point=[Number(linked?home.lat:lat),Number(linked?home.lng:lng)];
 locationRequest=null;
 if(dirty)form.dataset.dirty='yes';
 form.elements.lat.value=point[0].toFixed(6);form.elements.lng.value=point[1].toFixed(6);
 if(pickerMap){
  if(pickerMarker)pickerMarker.setLatLng(point);
  else{
   pickerMarker=L.marker(point,{draggable:true}).addTo(pickerMap);
   pickerMarker.on('dragend',()=>{const p=pickerMarker.getLatLng();setLocation(p.lat,p.lng);});
  }
  pickerMap.setView(point,Math.max(pickerMap.getZoom(),17));
 }
 const detail=Number.isFinite(accuracy)?' (ความแม่นยำประมาณ '+Math.round(accuracy)+' เมตร)':'';
 const status=linked?'ใช้พิกัดจากทะเบียนครัวเรือนที่เชื่อมไว้':(Number.isFinite(accuracy)?'ได้รับตำแหน่งปัจจุบันแล้ว':'เลือกตำแหน่งแล้ว')+detail;
 $('locationStatus').textContent=status+(linked?'':pickerMap?' ลากหมุดหรือแตะแผนที่เพื่อปรับตำแหน่ง':' แก้พิกัดในช่องได้เมื่อแผนที่ยังโหลดไม่ได้');
}
function locate(){
 const form=pickerForm,status=$('locationStatus');
 if(!form||!status)return;
 const home=linkedPlaceHome(form);
 if(home&&validCoordinate(home.lat,home.lng)){setLocation(home.lat,home.lng,null,false);return;}
 const fallback=pickerMap?' หรือเลือกตำแหน่งบนแผนที่':' หรือกรอกพิกัดในช่อง';
 if(window.isSecureContext===false){status.textContent='เปิดเว็บไซต์ผ่าน HTTPS เพื่อใช้ GPS'+fallback;return;}
 if(!navigator.geolocation){status.textContent='เบราว์เซอร์นี้ไม่รองรับการอ่านตำแหน่ง'+fallback;return;}
 const policy=document.permissionsPolicy||document.featurePolicy;
 if(policy?.allowsFeature?.('geolocation')===false){status.textContent='หน้านี้ถูกจำกัดสิทธิ์ GPS ลองเปิดลิงก์เว็บโดยตรง'+fallback;return;}
 const request=locationRequest={};
 const current=()=>locationRequest===request&&pickerForm===form;
 status.textContent='กำลังค้นหาตำแหน่ง กรุณาอนุญาตการเข้าถึงตำแหน่ง';
 navigator.geolocation.getCurrentPosition(({coords})=>{
  if(!current())return;
  if(validCoordinate(coords.latitude,coords.longitude))setLocation(coords.latitude,coords.longitude,coords.accuracy);
  else{locationRequest=null;status.textContent='อุปกรณ์ส่งพิกัดที่ใช้ไม่ได้ ลองอีกครั้ง'+fallback;}
 },error=>{
  if(!current())return;
  locationRequest=null;
  const message=error.code===1?'ยังไม่ได้รับสิทธิ์ GPS กรุณาอนุญาตตำแหน่งในเบราว์เซอร์':error.code===3?'ค้นหาตำแหน่งเกินเวลา ลองอีกครั้ง':'หาตำแหน่งไม่ได้ ลองเปิดบริการตำแหน่งของอุปกรณ์';
  status.textContent=message+fallback;
 },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

function qualityIssues(){const issues=[],h=rows('Households'),m=rows('Members'),add=(table,row,message)=>issues.push({table,id:row.id,label:recordLabel(table,row),message});h.forEach(r=>{if(r.status!=='สำรวจแล้ว')add('Households',r,'ยังไม่สำรวจครบ');if(!validCoordinate(r.lat,r.lng))add('Households',r,'ยังไม่มีพิกัด / พิกัดไม่ถูกต้อง');if(!m.some(p=>String(p.householdId)===String(r.id)))add('Households',r,'ยังไม่มีสมาชิก');if(r.members!==''&&r.members!=null&&Number(r.members)!==m.filter(p=>String(p.householdId)===String(r.id)).length)add('Households',r,'จำนวนสมาชิกไม่ตรงกับที่สำรวจ');});m.forEach(r=>{if(['',null,undefined].includes(r.age))add('Members',r,'ไม่ระบุอายุ');if(!h.some(x=>String(x.id)===String(r.householdId)))add('Members',r,'ไม่พบครัวเรือน');if(!r.sex)add('Members',r,'ไม่ระบุเพศ');});const duplicate=(table,key)=>{const seen=new Map();rows(table).forEach(r=>{const k=key(r);if(seen.has(k)){add(table,r,'อาจซ้ำกับ '+seen.get(k));}else seen.set(k,r.id);});};duplicate('Households',r=>[r.village,r.houseNo].map(v=>String(v||'').trim().toLowerCase()).join('|'));duplicate('Members',r=>[r.householdId,r.name,r.age].map(v=>String(v||'').trim().toLowerCase()).join('|'));duplicate('SurveillanceCases',r=>[r.memberId,r.disease,r.onsetDate].join('|'));duplicate('ScreeningRecords',r=>[r.memberId,r.type,r.screenDate].join('|'));const refs={memberId:'Members',householdId:'Households',visitId:'Visits',caseId:'SurveillanceCases',investigationId:'OutbreakInvestigations',relatedMemberId:'Members'};Object.keys(FIELDS).forEach(table=>rows(table).forEach(r=>Object.entries(refs).forEach(([field,target])=>{if(r[field]&&!rows(target).some(x=>String(x.id)===String(r[field])))add(table,r,'ไม่พบข้อมูลอ้างอิง '+field);})));return issues;}

async function submitForm(event){
 event.preventDefault();
 const form=event.target,button=form.querySelector('button[type=submit],button:not([type])');
 if(button?.disabled)return;
 if(form.id==='surveyForm'&&Number(form.dataset.step)!==4){const step=Number(form.dataset.step);if(validateSurveyStep(step))showSurveyStep(step+1);return;}
 const status=form.id==='surveyForm'?$('surveyStatus'):form.querySelector('[role=status]');
 if(button)button.disabled=true;
 if(status)status.textContent='กำลังดำเนินการ…';
 try{
  const values=Object.fromEntries(new FormData(form));
  if(form.id==='loginForm'){
   const auth=await api('login',values);if(!form.isConnected)return;
   menuReads.clear();
   Object.assign(state,{token:auth.token,dashboard:null,dashboardView:'disease',username:auth.username,role:auth.role,permissions:auth.permissions||{},mustChangePassword:auth.mustChangePassword,expiresAt:auth.expiresAt});
   state.warningTimer=setTimeout(()=>toast('เซสชันจะหมดอายุในอีก 2 นาที ระบบจะเก็บร่างในแท็บนี้'),Math.max(0,auth.expiresAt-Date.now()-120000));
   state.expiryTimer=setTimeout(()=>{lockSession(true);toast('เซสชันหมดอายุ กรุณาเข้าสู่ระบบอีกครั้ง');},Math.max(0,auth.expiresAt-Date.now()));
   closeModal(true);
   if(state.draft?.owner!==state.username)state.draft=null;
   if(auth.mustChangePassword){showPasswordChange();return;}
   state.page=state.draft?.survey?'surveys':allowedPage(state.pendingPage)?state.pendingPage:'home';
   await refresh();
   if(state.token){toast('เข้าสู่ระบบแล้ว');restoreDraft();}
   return;
  }
  if(!state.token)throw Error('กรุณาเข้าสู่ระบบก่อน');
  if(form.id==='auditSearchForm'&&state.page==='audit'){
   state.auditQuery=String(values.query||'').trim();state.audit=null;
   await refresh({reuse:true});return;
  }
  if(form.id==='surveyForm'){
   for(let step=0;step<SURVEY_STEPS.length;step++)if(!validateSurveyStep(step))throw Error('กรุณาตรวจช่องที่ระบุ');
   const payload=surveyValues(form,values);
   for(const member of payload.members)if(member.vaccination&&['vaccineName','dose','givenDate','facility'].some(key=>!member.vaccination[key])){showSurveyStep(2);throw Error('ระบุชื่อวัคซีน เข็ม วันที่ได้รับ และสถานพยาบาลให้ครบ');}
   if((payload.household.lat||payload.household.lng)&&!validCoordinate(payload.household.lat,payload.household.lng)){showSurveyStep(0);throw Error('กรุณาระบุละติจูดและลองจิจูดให้ถูกต้องทั้งสองช่อง');}
   delete payload.requestId;
   const result=await api('saveHouseholdSurvey',{...payload,requestId:pendingRequest(form,payload)});
   try{if(form.dataset.storedDraft&&localSurveyDraft()?.id===form.dataset.storedDraft)localStorage.removeItem(DRAFT_STORAGE);}catch(error){}
   if(form.isConnected){
    if(state.page==='households')state.householdId=result.householdId;
    closeModal(true);await refresh();
   }
   toast('บันทึกและเชื่อมทะเบียนแล้ว');return;
  }
  if(form.id==='placeForm'){
   if(!validCoordinate(values.lat,values.lng))throw Error('กรุณาตรวจละติจูดและลองจิจูด');
   if(form.dataset.id)values.id=form.dataset.id;
   if(values.type!=='อื่น ๆ')values.otherType='';
   await saveRecord(form,'CommunityMaps',values);
   if(form.isConnected){closeModal(true);await refresh();}
   toast('บันทึกสถานที่แล้ว');return;
  }
  if(form.id==='healthMapForm'){clearTimeout(mapSearchTimer);await applyHealthMapFilters(healthMapFormValues(form));return;}
  if(form.id==='analyticsFilters'){await applyFilters(values);return;}
  if(form.id==='careFilters'){await applyCareFilters({village:values.careVillage||'',sex:values.careSex||'',ageMin:values.careAgeMin??'',ageMax:values.careAgeMax??'',fiscalYear:values.careFiscalYear,typeId:values.careTypeId||'',groupId:values.careGroupId||'',visitStatus:values.careVisitStatus||''});return;}
  if(form.id==='userForm'){await api('manageUser',{...values,active:values.active==='เปิดใช้งาน'});closeModal(true);await loadUsers();toast('บันทึกบัญชีแล้ว');return;}
  if(form.id==='systemSettingsForm'){
   const config=await api('saveSystemSettings',{sessionMinutes:values.sessionMinutes});
   if(form.isConnected){state.systemSettings=config;delete form.dataset.dirty;status.textContent='บันทึกแล้ว ใช้กับการเข้าสู่ระบบครั้งถัดไป';}
   return;
  }
  if(form.id==='recordForm'){
   const table=form.dataset.table;if(form.dataset.id)values.id=form.dataset.id;
   if(FIELDS[table].some(f=>f[2]==='photo')){const file=values.photoFile?.size?values.photoFile:form.draftPhoto;delete values.photoFile;if(file?.size)values.photo=await recordPhoto(file);else if(values.removePhoto==='yes')values.photo='';delete values.removePhoto;}
   if(table==='ScreeningTypes')values.methodResults=String(values.methodResults||'').trim()?JSON.stringify(Object.fromEntries(String(values.methodResults||'').split('\n').filter(s=>s.trim()).map(line=>{const [method,results,...extra]=line.split('|');if(!method?.trim()||!results?.trim()||extra.length)throw Error('ระบุหนึ่งวิธีและชุดผลต่อบรรทัด');return [method.trim(),results.split(',').map(v=>v.trim()).filter(Boolean)];}))):'';
   if(table==='GrowthReferences')values.points=JSON.stringify(values.points.split('\n').filter(s=>s.trim()).map(line=>line.split(',').map(v=>v.trim()?Number(v):null)));
   if(table==='LifeHistories'&&!values.consentId&&!String(values.lifeConsentPurpose||'').trim())throw Error('กรุณาเลือกความยินยอมเดิม หรือระบุขอบเขตความยินยอมที่ได้รับ');

   let result;
   if(table==='Members'){
    let pregnancy=null;if(values.pregnant==='ใช่'&&Object.prototype.hasOwnProperty.call(values,'p_episodeDate')){pregnancy=Object.fromEntries(Object.entries(values).filter(([k])=>k.startsWith('p_')).map(([k,v])=>[k.slice(2),v]));if(values.pregnancyId)pregnancy.id=values.pregnancyId;if(values.pregnancyUpdatedAt)pregnancy.updatedAt=values.pregnancyUpdatedAt;}
    Object.keys(values).filter(k=>k.startsWith('p_')||['pregnancyId','pregnancyUpdatedAt'].includes(k)).forEach(k=>delete values[k]);
    const payload={member:values,pregnancy};
    result=await api('saveMemberCare',{...payload,requestId:pendingRequest(form,payload)});
    if(form.isConnected){state.memberId=result.id;state.householdId=values.householdId;state.page='households';state.tab='members';const age=memberAge(values);state.memberTab=values.pregnant==='ใช่'?'maternal':age!==null&&age<=5?'vaccination':'screening';}
   }else if(table==='Pregnancies')result=await api('savePregnancy',{record:values,requestId:pendingRequest(form,values)});
   else result=await saveRecord(form,table,serializeCareRecord(table,values));
   if(!form.isConnected)return;
   if(table==='Households'){state.householdId=result.id;state.memberId=null;state.page='households';state.tab='members';}
   closeModal(true);await refresh();toast('บันทึกข้อมูลแล้ว');
  }
  else if(form.id==='healthForm'){const record={updatedAt:values.updatedAt||'',diseaseId:form.dataset.form,memberId:values.memberId||'',householdId:values.householdId||'',report:values.report||''};delete values.updatedAt;delete values.memberId;delete values.householdId;delete values.report;record.values=JSON.stringify(values);record.notes=values.notes||'';if(form.dataset.id)record.id=form.dataset.id;const result=await saveRecord(form,'DiseaseRecords',record);if(!form.isConnected)return;delete form.dataset.dirty;form.dataset.id=result.id;form.elements.updatedAt.value=result.updatedAt;await refresh();if(status?.isConnected)status.textContent='บันทึกแบบฟอร์มแล้ว';toast('บันทึกแบบฟอร์มแล้ว');}
  else if(form.id==='builderForm'){const schema=values.schema.split('\n').filter(x=>x.trim()).map((line,i)=>{const [label,type='text',options='']=line.split('|').map(x=>x.trim());if(!label||!['text','number','date','textarea','select'].includes(type))throw Error('รูปแบบคำถามไม่ถูกต้องที่บรรทัด '+(i+1));const choices=options.split(',').map(x=>x.trim()).filter(Boolean);if(type==='select'&&!choices.length)throw Error('กรุณาใส่ตัวเลือกที่บรรทัด '+(i+1));return {key:'field_'+(i+1),label,type,options:choices};});const result=await saveRecord(form,'DiseaseForms',{name:values.name.trim(),schema:JSON.stringify(schema),reportable:String(values.reportable==='true'),notes:values.notes});if(!form.isConnected)return;state.formId=result.id;state.page='diseases';closeModal(true);await refresh();}
  else if(form.id==='passwordForm'){if(values.newPassword!==values.confirmPassword)throw Error('ยืนยันรหัสผ่านใหม่ไม่ตรงกัน');await api('changePassword',values);lockSession(!!state.draft);toast('เปลี่ยนรหัสผ่านแล้ว กรุณาเข้าสู่ระบบใหม่');}
 }catch(error){if(status?.isConnected)status.textContent=error.message;else toast(error.message);}finally{if(button)button.disabled=false;}
}
function pendingRequest(form,payload){
 const signature=JSON.stringify(payload);
 if(!form.dataset.request||form.dataset.requestSignature&&form.dataset.requestSignature!==signature)form.dataset.request=makeRequestId();
 form.dataset.requestSignature=signature;
 return form.dataset.request;
}
function saveRecord(form,table,record){
 return api('save',{table,record,requestId:pendingRequest(form,record)});
}
function download(blob,name){const link=document.createElement('a'),url=URL.createObjectURL(blob);link.href=url;link.download=name;link.target='_self';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function printable(title,body,opened){const w=opened||window.open('','_blank');if(!w)return toast('กรุณาอนุญาตป๊อปอัปเพื่อพิมพ์');w.document.write('<!doctype html><html lang="th"><meta charset="utf-8"><title>'+esc(title)+'</title><style>body{font:15px Tahoma,sans-serif;margin:30px;line-height:1.7}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:7px}pre{white-space:pre-wrap;font:inherit}</style><body>'+body+'</body></html>');w.document.close();setTimeout(()=>{w.focus();w.print();},300);}
async function exportTable(table,format){if(!state.token)return loginModal();const from=$('exportFrom')?.value||'',to=$('exportTo')?.value||'';if(from&&to&&from>to)throw Error('ตรวจช่วงวันที่ส่งออก');const list=(await api('exportData',{table})).filter(r=>{const date=r.eventDate||r.assessmentDate||r.reportDate||r.screenDate||r.surveyDate||r.attendedDate||r.appointmentDate||r.givenDate||String(r.updatedAt||'').slice(0,10);return !from&&!to||date&&(!from||date>=from)&&(!to||date<=to);}),keys=table==='DiseaseRecords'?['id','diseaseId','memberId','householdId','values','report','updatedAt']:['id',...FIELDS[table].map(f=>f[0]),...(table==='Households'?['lat','lng','environment']:[]),...(table==='ScreeningRecords'?['bmi']:[])];if(['ScreeningHistory','ScreeningEligibility','VulnerabilityRecords','Pregnancies','AntenatalCare','VaccinationPlans','ChildVaccinations'].includes(table)&&!keys.includes('householdId'))keys.push('householdId');if(table==='ScreeningHistory')keys.push('values');const exported=list.map(record=>Object.fromEntries(keys.map(key=>[key,record[key]??''])));

function vaccineFollowUp(){
 const period=state.care?.period,todayDate=today(),horizon=dayOffset(30);
 const received=rows('ChildVaccinations').filter(v=>['ได้รับตามกำหนด','ได้รับล่าช้า'].includes(v.status)&&/^\d{4}-\d{2}-\d{2}$/.test(v.givenDate)&&v.givenDate<=todayDate);
 const normalize=value=>String(value||'').normalize('NFKC').trim().toLowerCase().replace(/\s+/g,' ');
 const upcoming=careRows('VaccinationPlans').filter(p=>p.status==='ต้องรับ'&&(!state.subjectFilter||String(p.memberId)===String(state.subjectFilter))&&(!period||p.dueDate>=period.from&&p.dueDate<=period.to)&&p.dueDate<=horizon);
 return upcoming.flatMap(plan=>{
  const schedule=rows('VaccineSchedules').find(s=>String(s.id)===String(plan.scheduleId));
  const complete=received.some(v=>String(v.memberId)===String(plan.memberId)&&(v.planId?String(v.planId)===String(plan.id):schedule&&normalize(v.vaccineName)===normalize(schedule.vaccineName)&&normalize(v.dose)===normalize(schedule.dose)));
  return complete?[]:[[memberName(plan.memberId),schedule?.vaccineName||plan.scheduleId,schedule?.dose||'',plan.dueDate,plan.dueDate<todayDate?'เลยกำหนด':'ถึงกำหนดภายใน 30 วัน']];

function initCombos(container){
 for(const select of container.querySelectorAll?.('select[data-combo]')||[]){
  if(select.previousElementSibling)continue;
  const wrapper=select.parentElement,input=document.createElement('input'),list=document.createElement('div');
  const id=select.id+'_options',label=wrapper.parentElement.querySelector('label');
  select.tabIndex=-1;select.classList.add('combo-value');select.setAttribute('aria-hidden','true');
  input.id=select.id+'_search';input.type='search';input.autocomplete='off';input.placeholder='พิมพ์ค้นหา';input.setAttribute('role','combobox');input.setAttribute('aria-autocomplete','list');input.setAttribute('aria-controls',id);input.setAttribute('aria-expanded','false');
  if(label)label.htmlFor=input.id;
  list.id=id;list.className='combo-options';list.hidden=true;list.setAttribute('role','listbox');
  wrapper.prepend(input);wrapper.append(list);
  const sync=()=>{input.value=select.value?select.selectedOptions[0]?.textContent||'':'';input.setCustomValidity(select.required&&!select.value?'กรุณาเลือกรายการ':'');};
  select.syncCombo=sync;sync();
  let index=-1;
  const close=()=>{list.hidden=true;input.setAttribute('aria-expanded','false');input.removeAttribute('aria-activedescendant');};
  const open=query=>{
   list.hidden=false;input.setAttribute('aria-expanded','true');index=-1;
   const q=query.trim().toLowerCase();
   const options=Array.from(select.options).filter(o=>!q||[o.value,o.textContent].some(v=>v.toLowerCase().includes(q))).slice(0,40);
   list.innerHTML=options.length?options.map((o,i)=>`<button type="button" role="option" tabindex="-1" id="${id}_${i}" data-value="${esc(o.value)}">${esc(o.textContent)}</button>`).join(''):'<span>ไม่พบรายการ</span>';
  };
  const choose=value=>{select.value=value;sync();close();select.dispatchEvent(new Event('change',{bubbles:true}));};
  input.addEventListener('focus',()=>{input.select();open('');});
  input.addEventListener('input',()=>{select.value='';input.setCustomValidity(input.value||select.required?'กรุณาเลือกรายการจากผลค้นหา':'');open(input.value);});
  input.addEventListener('blur',()=>{sync();close();});
  list.addEventListener('pointerdown',event=>event.preventDefault());
  list.addEventListener('click',event=>{const option=event.target.closest('[data-value]');if(option)choose(option.dataset.value);});
  input.addEventListener('keydown',event=>{
   if(event.key==='Escape'){event.stopPropagation();sync();close();return;}
   if(!['ArrowDown','ArrowUp','Enter'].includes(event.key)||list.hidden&&event.key==='Enter')return;
   if(list.hidden)open('');
   const options=Array.from(list.querySelectorAll('[data-value]'));

   if(!options.length)return;
   event.preventDefault();
   if(event.key==='Enter'){choose(options[Math.max(0,index)].dataset.value);return;}
   index=(index+(event.key==='ArrowDown'?1:-1)+options.length)%options.length;
   options.forEach((o,i)=>o.setAttribute('aria-selected',String(i===index)));input.setAttribute('aria-activedescendant',options[index].id);options[index].scrollIntoView({block:'nearest'});
  });
 }
}

function surveyValues(form,values){
 const byPrefix=prefix=>Object.fromEntries(Object.entries(values).filter(([k])=>k.startsWith(prefix)).map(([k,v])=>[k.slice(prefix.length),v]));
 const group=id=>Array.from($(id).querySelectorAll('[data-prefix]'),node=>byPrefix(node.dataset.prefix));
 const household=byPrefix('home_');if(form.dataset.house)household.id=form.dataset.house;
 const members=group('surveyMembers').map(member=>{
  const fields=Object.entries(member),vulnerabilityTypeIds=fields.filter(([key])=>key.startsWith('group_')).map(([key])=>key.slice(6));
  const vaccine=Object.fromEntries(fields.filter(([key])=>key.startsWith('vacc_')).map(([key,value])=>[key.slice(5),value]));
  const record=Object.fromEntries(fields.filter(([key])=>!key.startsWith('group_')&&!key.startsWith('vacc_')));
  return {...record,vulnerabilityTypeIds,vaccination:Object.values(vaccine).some(Boolean)?vaccine:null};
 });
 return {id:form.dataset.id,requestId:form.dataset.request,updatedAt:values.updatedAt,household,members,pets:group('surveyPets'),surveyDate:values.surveyDate,collectorId:values.collectorId,notes:values.notes};
}
function showSurveyStep(index){

 form.querySelectorAll('.survey-step').forEach(node=>{node.hidden=Number(node.dataset.step)!==step;});
 form.querySelector('[data-action=surveyPrevious]').hidden=step===0;
 form.querySelector('[data-action=surveyNext]').hidden=step===4;
 form.querySelector('[type=submit]').hidden=step!==4;
 $('surveyProgress').value=step+1;
 $('surveyProgressLabel').textContent=`ขั้นตอน ${step+1} / 5 · ${SURVEY_STEPS[step]}`;
 if(step===2)$('surveyHealth').classList.toggle('empty',!$('surveyHealth').children.length);
 if(step===4){
  const data=surveyValues(form,Object.fromEntries(new FormData(form)));
  $('surveyRecap').innerHTML=`<p><strong>บ้านเลขที่ ${esc(data.household.houseNo)} · ${esc(data.household.village)}</strong> · ${esc(data.surveyDate)}</p><p>สมาชิก ${data.members.length} คน · สัตว์เลี้ยง ${data.pets.length} รายการ · ประวัติวัคซีนเด็กที่เพิ่ม ${data.members.filter(m=>m.vaccination).length} รายการ</p>`;
 }

}
function validateSurveyStep(step){

const DRAFT_STORAGE='community.health.survey.draft.v1';
function draftPasswordHTML(mode){
 const action=mode==='save'?'draftSave':'draftLoad';
 return `<div class="field"><label for="draftPassword">รหัสปลดล็อกร่าง</label><input type="password" id="draftPassword" autocomplete="off" minlength="12"></div>
 <p class="muted">${mode==='save'?'ตั้งรหัสอย่างน้อย 12 ตัวอักษร ระบบจะเก็บร่างที่เข้ารหัสในเบราว์เซอร์นี้หนึ่งฉบับ':'ใช้รหัสที่ตั้งไว้ตอนบันทึกร่าง'}</p>
 <button type="button" class="btn secondary" data-action="${action}">${mode==='save'?'เข้ารหัสและเก็บร่าง':'เปิดร่าง'}</button><p id="draftStatus" role="status"></p>`;
}
function localSurveyDraft(){
 try{return JSON.parse(localStorage.getItem(DRAFT_STORAGE)||'null');}catch(error){return null;}
}
function draftBytes(data){return btoa(Array.from(data,n=>String.fromCharCode(n)).join(''));}
function readDraftBytes(data){return Uint8Array.from(atob(data),c=>c.charCodeAt(0));}
async function draftKey(password,salt){
 if(!window.isSecureContext||!crypto.subtle)throw Error('ใช้ HTTPS และเบราว์เซอร์ที่รองรับการเข้ารหัสร่าง');
 const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
function currentSurveyDraft(form){
 return {...surveyValues(form,Object.fromEntries(new FormData(form))),step:Number(form.dataset.step||0),requestSignature:form.dataset.requestSignature,storedDraft:form.dataset.storedDraft};
}
async function manageSurveyDraft(mode){
 const password=$('draftPassword').value,status=$('draftStatus'),token=state.token,form=$('surveyForm'),saved=localSurveyDraft();
 if(password.length<12)throw Error('กรุณาใช้รหัสปลดล็อกอย่างน้อย 12 ตัวอักษร');
 const method=mode==='save'?'encrypt':'decrypt';
 if(mode==='load'&&(!saved||saved.version!==1))throw Error('ไม่มีร่างให้เปิด');
 const data=mode==='save'?currentSurveyDraft(form):null;
 if(mode==='save'&&saved&&saved.id!==form.dataset.storedDraft&&!confirm('บันทึกร่างนี้แทนร่างเดิมในเบราว์เซอร์หรือไม่?'))return;
 const salt=mode==='save'?crypto.getRandomValues(new Uint8Array(16)):readDraftBytes(saved.salt);
 const iv=mode==='save'?crypto.getRandomValues(new Uint8Array(12)):readDraftBytes(saved.iv);
 status.textContent='กำลังประมวลผล…';
 const key=await draftKey(password,salt),algorithm={name:'AES-GCM',iv};
 if(token!==state.token||!status.isConnected)return;
 if(method==='encrypt'){
  const id=makeRequestId(),plain=new TextEncoder().encode(JSON.stringify({owner:state.username,data}));
  const encrypted=await crypto.subtle.encrypt(algorithm,key,plain);
  if(token!==state.token||!status.isConnected)return;
  try{localStorage.setItem(DRAFT_STORAGE,JSON.stringify({version:1,id,salt:draftBytes(salt),iv:draftBytes(iv),data:draftBytes(new Uint8Array(encrypted))}));}
  catch(error){throw Error('เบราว์เซอร์ไม่อนุญาตให้เก็บร่าง หรือพื้นที่จัดเก็บเต็ม');}
  form.dataset.storedDraft=id;$('draftPassword').value='';status.textContent='เก็บร่างที่เข้ารหัสแล้ว';
  return;
 }
 let clear;
 try{clear=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt(algorithm,key,readDraftBytes(saved.data))));}
 catch(error){throw Error('เปิดร่างไม่ได้ กรุณาตรวจสอบรหัสปลดล็อก');}
 if(token!==state.token||!status.isConnected)return;
 if(clear.owner!==state.username)throw Error('ร่างเป็นของบัญชีอื่น');
 const restored={...clear.data,storedDraft:saved.id};
 editSurvey(restored.id,restored.household.id,restored);
}

function photoHTML(value){return /^data:image\/jpeg;base64,[0-9A-Za-z+/]+={0,2}$/.test(value||'')?`<img class="record-photo" src="${esc(value)}" alt="ภาพประกอบที่บันทึก">`:'';}
async function recordPhoto(file){
 if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>8*1024*1024)throw Error('เลือกภาพ JPG, PNG หรือ WebP ขนาดไม่เกิน 8 MB');
 const bitmap=await createImageBitmap(file);
 try{
  const canvas=document.createElement('canvas');
  for(const max of [800,500,320,200]){
   const scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
   const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
   const result=canvas.toDataURL('image/jpeg',0.72);if(result.length<=36000)return result;
  }
  throw Error('รูปภาพใหญ่เกินไป กรุณาเลือกภาพอื่น');
 }finally{bitmap.close();}
}

function layoutFamily(useRelations){
 const members=rows('Members').filter(m=>String(m.householdId)===state.familyHousehold);
 const layers=new Map(members.map(m=>[String(m.id),0]));
 if(useRelations){
  const edges=familyRelationships().flatMap(r=>['พ่อ','แม่','ปู่ย่าตายาย'].includes(r.relationship)?[[String(r.memberId),String(r.relatedMemberId)]]:['ลูก','หลาน'].includes(r.relationship)?[[String(r.relatedMemberId),String(r.memberId)]]:[]);
  for(let i=0;i<Math.min(6,members.length);i++)for(const [parent,child] of edges)if(layers.get(child)<=layers.get(parent)&&layers.get(parent)<5)layers.set(child,layers.get(parent)+1);
 }
 const groups=[...new Set(layers.values())].sort((a,b)=>a-b);
 return groups.flatMap((level,i)=>{const group=members.filter(m=>layers.get(String(m.id))===level);return group.map((m,j)=>({id:String(m.id),x:(j+1)/(group.length+1),y:groups.length===1?.5:(i+1)/(groups.length+1),symbol:'●'}));});
}

async function readImportMatrix(file){
 const data=await file.arrayBuffer();
 if(/\.docx$/i.test(file.name)){
  await loadLibrary('JSZip');
  const zip=await JSZip.loadAsync(data),part=zip.file('word/document.xml');
  if(!part)throw Error('ไม่พบเอกสาร Word ที่รองรับ');
  const xml=await part.async('string');if(xml.length>8000000)throw Error('ตาราง Word ใหญ่เกินไป');
  const root=new DOMParser().parseFromString(xml,'application/xml'),ns='http://schemas.openxmlformats.org/wordprocessingml/2006/main',wordTable=root.getElementsByTagNameNS(ns,'tbl')[0];
  if(!wordTable)throw Error('DOCX ต้องมีตาราง โดยใช้แถวแรกเป็นหัวคอลัมน์');
  return [...wordTable.children].filter(r=>r.localName==='tr').map(r=>[...r.children].filter(c=>c.localName==='tc').map(c=>[...c.getElementsByTagNameNS(ns,'p')].map(p=>[...p.getElementsByTagNameNS(ns,'t')].map(t=>t.textContent).join('')).join('\n')));
 }
 await loadLibrary('XLSX');
 const book=XLSX.read(data,{type:'array',sheetRows:1002});
 return XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,defval:'',raw:false,blankrows:false});
}
